
name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate GitHub Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Generate SVG graphics
        run: python .github/workflows/generate-github-stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: kimvns

      - name: Commit updated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/contribution-calendar.svg \
            .github/workflows/contributions-by-month.svg \
            .github/workflows/repository-stats.svg

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos gráficos."
          else
            git commit -m "chore: update GitHub statistics"
            git push
          fi
