<svg xmlns="http://www.w3.org/2000/svg"
        width="760" height="250"
        viewBox="0 0 760 250"
        role="img" aria-label="Public GitHub repository statistics">
    <title>Public GitHub repository statistics</title>
    <style>
        text {
            font-family: -apple-system, BlinkMacSystemFont,
            'Segoe UI', sans-serif;
        }
        .title {
            fill: #e6edf3;
            font-size: 16px;
            font-weight: 600;
        }
        .muted {
            fill: #8b949e;
            font-size: 11px;
        }
        .value {
            fill: #e6edf3;
            font-size: 24px;
            font-weight: 700;
        }
    </style>

<text x="24" y="28" class="title">Estatísticas dos repositórios públicos</text>
<rect x="24" y="48" width="210" height="75" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="40" y="78" class="muted">Repositórios públicos</text>
<text x="40" y="108" class="value">3</text>
<rect x="264" y="48" width="210" height="75" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="280" y="78" class="muted">Estrelas recebidas</text>
<text x="280" y="108" class="value">0</text>
<text x="24" y="160" class="title">Linguagens principais por repositório</text>
<text x="24" y="184" class="muted">JavaScript</text>
<text x="320" y="184" class="muted">1 repositório(s)</text>
<text x="24" y="204" class="muted">PHP</text>
<text x="320" y="204" class="muted">1 repositório(s)</text>
</svg>